name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (pinned versions, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            numpy==1.26.3 scipy==1.12.0 pandas==2.2.3 matplotlib==3.8.2 \
            jax==0.4.31 jaxlib==0.4.31 torch==2.5.1 sbi==0.25.0 zuko==1.5.0 nflows==0.14 pyknos==0.16.0 \
            emcee==3.1.6 corner==2.2.2 arviz==0.23.1 pytest==8.3.3
          pip install -e . --no-deps
      - name: Tests
        run: pytest -q
