# Exact versions the package, its tests and the notebooks were run with.
#   conda env create -f environment.yml && conda activate gwbf-foregrounds
name: gwbf-foregrounds
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - numpy==1.26.3
      - scipy==1.12.0
      - pandas==2.2.3
      - matplotlib==3.8.2
      - jax==0.4.31
      - jaxlib==0.4.31
      - torch==2.5.1
      - sbi==0.25.0          # the released networks load with this version
      - zuko==1.5.0
      - nflows==0.14
      - pyknos==0.16.0
      - emcee==3.1.6
      - corner==2.2.2
      - arviz==0.23.1
      - pytest==8.3.3
      - ipykernel==6.29.0
      - nbconvert==7.16.6
      - -e .
